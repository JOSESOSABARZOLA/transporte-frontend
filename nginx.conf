# Nginx Configuration for React SPA
# Serves static files and redirects all non-file requests to index.html (SPA routing)

# Resolver for dynamic hostname resolution (required for Docker service name resolution)
# Uses Docker's internal DNS (127.0.0.11:53)
resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

server {
    listen 5180;
    server_name _;

    # Security Headers
    #
    # RETIRADA `X-XSS-Protection` el 2026-08-19. Es una cabecera obsoleta: los navegadores
    # actuales la ignoran, y en los antiguos su filtro llego a INTRODUCIR vulnerabilidades
    # -podia recortar codigo legitimo hasta convertirlo en explotable-. La guia actual es
    # omitirla o enviarla en 0. Su papel lo cubre la Content-Security-Policy de abajo.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content-Security-Policy ──
    #
    # Es la ULTIMA LINEA, la que actua cuando todo lo demas ya fallo. Hoy no hay ningun
    # sumidero de HTML en el codigo -ni dangerouslySetInnerHTML, ni innerHTML, ni eval- y
    # React escapa por su cuenta, asi que no protege de nada que exista. Protege de lo que
    # venga: una dependencia comprometida, o un innerHTML que alguien agregue sin pensar.
    #
    # Y en un sistema que existe PORQUE el cuadro se filtraba, `connect-src 'self'` importa
    # tanto como `script-src`: aunque alguien lograra ejecutar codigo, no podria enviar los
    # datos a un servidor de fuera.
    #
    # SE PUEDE SER ESTRICTO PORQUE TODO ES DEL MISMO ORIGEN: Montserrat es un .woff2 local,
    # no hay CDN y no hay ningun script externo. Si algun dia se agrega uno, hay que
    # declararlo aqui o la pagina dejara de cargarlo SIN ERROR VISIBLE en la interfaz: el
    # aviso sale en la consola del navegador. Comprobar ahi tras cada cambio.
    #
    # `style-src` lleva 'unsafe-inline' por el style="" de index.html y por daisyUI.
    # `script-src` NO lo lleva, que es la mitad que detiene el XSS.
    # `worker-src 'self' blob:` por el VISOR DE PDF (react-pdf/pdf.js): el worker se sirve
    # desde el propio origen (Vite lo emite como asset, sin CDN), y pdf.js puede instanciarlo
    # como worker `blob:`. Sin esta holgura, el visor no carga y no hay error en la interfaz.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Health check endpoint (must be before /api/ and / to be matched first)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy de la API: reenvia /api/v1/* al backend (http://transporte-app:3003).
    # Evita CORS porque las peticiones salen del mismo origen.
    # NO se reescribe la ruta: el backend expone /api/v1 como prefijo global, y el
    # httpClient del frontend ya lo incluye en su baseURL. El prefijo vive en un solo
    # sitio de cada lado.
    # CRITICO: debe ir ANTES de location / para tener precedencia.
    location /api/ {
        set $backend_url http://transporte-app:3003;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # NO hay bloque de CORS, y es deliberado. Las peticiones que pasan por aqui son
        # del MISMO origen que la aplicacion, asi que el navegador no hace verificacion
        # previa: el bloque anterior no se ejecutaba nunca y, si lo hubiera hecho,
        # anunciaba 'Access-Control-Allow-Origin: *' contradiciendo la lista blanca del
        # backend (CORS_ORIGINS), y omitia x-correlation-id de las cabeceras admitidas.
        # El acceso directo al puerto 3003 lo resuelve el CORS del propio backend.
    }

    # Cache control for assets
    # Las cabeceras de seguridad se REPITEN aqui: nginx no hereda las del nivel superior
    # en un bloque que declara sus propias add_header, de modo que hasta ahora los .js y
    # .css se servian sin nosniff ni proteccion de marco.
    # `mjs` incluido por el worker de pdf.js (visor de PDF): asset hasheado e inmutable.
    #
    # EL MIME DE `.mjs` SE FUERZA A JAVASCRIPT. El `mime.types` de esta imagen (nginx
    # 1.27-alpine) NO mapea `.mjs`, así que caía en `application/octet-stream`; con
    # `X-Content-Type-Options: nosniff`, el navegador RECHAZA ejecutar el worker de módulo y el
    # visor no renderiza nada. `default_type` solo actúa sobre las extensiones que el mapa no
    # cubre —`.mjs`—; `.js`, `.css`, etc. conservan el suyo. Ver `VisorPdfMemorando.tsx`.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML files - NO CACHE (2026-09-25). Antes mezclaba `expires -1` con `must-revalidate`, y en
    # la práctica el navegador REUSABA el index.html viejo —que apunta a los .js/.css hasheados
    # viejos (immutable)—, así que tras cada despliegue se seguía ejecutando la app anterior hasta
    # cerrar sesión (recarga completa). `no-store` obliga a pedir el index.html fresco SIEMPRE, con
    # lo que los nuevos hashes de assets se cargan sin reloguear. El index.html pesa poco: no cachearlo
    # no tiene coste apreciable. El SPA (`location /` → try_files /index.html) re-entra en esta
    # location por el nombre `.html`, así que la cabecera también aplica a las rutas de la aplicación.
    location ~* \.html?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Se repite porque nginx NO hereda las del nivel superior en un bloque que declara
        # las suyas, y este es el que sirve index.html: la CSP solo surte efecto sobre el
        # documento, no sobre los .js ni los .css, asi que ESTE es el sitio que cuenta.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # SPA routing: redirect all non-file requests to index.html
    # This is the default handler, must be LAST
    location / {
        try_files $uri $uri/ /index.html;
    }
}
